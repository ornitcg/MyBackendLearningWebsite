<title>Backend מאפס ל-Scale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: right-side module rail (RTL) + reading column; the course is a request path from client (m0) down to scale (m10+) */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E8EDEA; --ink:#14201C; --muted:#56665F; --line:#D5DEDA;
  --accent:#0A7A64; --accent-ink:#FFFFFF; --accent-soft:#D6EFE8;
  --partial:#A8630A; --partial-soft:#F6E7D2; --bad:#B42318; --bad-soft:#F9DEDB;
  --code-bg:#0F1915; --code-ink:#DCE7E2; --code-muted:#7F948B; --code-line:#22312B;
  --hl-key:#7FD8BE; --hl-str:#F2C27B; --hl-num:#E59AA9; --hl-fn:#9CC9FF; --hl-com:#6F857B; --hl-type:#C7B4FF;
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
  /* one vivid hue per course stage: foundations · API · production · scale · career */
  --g0:#E8445F; --g1:#D96500; --g2:#0E9C8E; --g3:#2F6FED; --g4:#B52EC0; --on-c:#FFFFFF; --c:var(--accent);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --g0:#FF7A90; --g1:#FFA634; --g2:#2FD9C4; --g3:#7CA4FF; --g4:#EC74F2; --on-c:#0B1014;
}}
:root[data-theme="dark"]{ --g0:#FF7A90; --g1:#FFA634; --g2:#2FD9C4; --g3:#7CA4FF; --g4:#EC74F2; --on-c:#0B1014; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1210; --surface:#131C18; --sunk:#0F1714; --ink:#E3ECE7; --muted:#93A59D; --line:#24322C;
  --accent:#3FCCA6; --accent-ink:#06231B; --accent-soft:#143A30;
  --partial:#F0B44C; --partial-soft:#3A2B12; --bad:#FF8A7A; --bad-soft:#3D1A16;
  --code-bg:#08100D; --code-line:#1B2823; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1210; --surface:#131C18; --sunk:#0F1714; --ink:#E3ECE7; --muted:#93A59D; --line:#24322C;
  --accent:#3FCCA6; --accent-ink:#06231B; --accent-soft:#143A30;
  --partial:#F0B44C; --partial-soft:#3A2B12; --bad:#FF8A7A; --bad-soft:#3D1A16;
  --code-bg:#08100D; --code-line:#1B2823; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.1rem;font-weight:500}
p{margin:0 0 .8em} ul,ol{margin:0 0 .8em;padding-inline-start:1.3em} li{margin:.2em 0}
a{color:var(--accent)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:.08em .35em;border-radius:5px;direction:ltr;unicode-bidi:embed}
pre{font-family:var(--f-mono);font-size:.84rem;line-height:1.6;background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r);overflow-x:auto;direction:ltr;text-align:left;margin:0 0 .8em}
pre code{background:none;padding:0;font-size:inherit;color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{font-family:var(--f-mono);font-size:.78rem;font-weight:600;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:6px;direction:ltr}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.top .grow{flex:1}
.sync{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="saved"] i{background:var(--accent)} .sync[data-s="saving"] i{background:var(--partial)} .sync[data-s="error"] i{background:var(--bad)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px}

/* shell */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 56px)}
.rail{border-inline-end:1px solid var(--line);background:var(--surface);padding:18px 12px 40px;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto}
.rail .group{margin:14px 10px 6px}
.rail a{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.3}
.rail a:hover{background:var(--sunk)}
.rail a.on{background:var(--accent-soft)}
.rail .num{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);direction:ltr}
.rail .home-link{grid-template-columns:30px 1fr;font-weight:600}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px;min-width:0}
.col{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* status chips */
.chip{font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:5px;direction:ltr;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.part{background:var(--partial-soft);color:var(--partial)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.muted{color:var(--muted)}
.crumbs{font-size:.88rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap} .crumbs a{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 16px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:stretch}
.hero h1{margin-bottom:8px}
.req{font-family:var(--f-mono);font-size:.82rem;direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:16px;line-height:1.75;overflow-x:auto}
.req .m{color:var(--hl-key)} .req .s{color:var(--hl-str)} .req .c{color:var(--code-muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:var(--muted)}
.next{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:18px 22px}
.next h3{font-size:1.2rem}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;direction:ltr;width:max-content}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 35%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 65%,var(--sunk))}
.heat i[data-l="3"]{background:var(--accent)}
.map-group{display:flex;flex-direction:column;gap:2px}
.map-row{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:14px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.map-row:hover h3{color:var(--accent)}
.map-row .num{font-family:var(--f-mono);font-size:.9rem;color:var(--muted);direction:ltr;text-align:center}
.map-row p{margin:0;font-size:.92rem;color:var(--muted)}
.map-row .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.method{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:s}
.method div{border-top:3px solid var(--accent);padding-top:8px;font-size:.92rem}
.method b{display:block;font-family:var(--f-display);font-weight:500}

/* module */
.mod-head{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.lesson-list{display:flex;flex-direction:column}
.lesson-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lesson-item:hover b{color:var(--accent)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--accent-ink)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.checklist{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--sunk);cursor:pointer}
.checklist input{margin-top:5px;accent-color:var(--accent);width:17px;height:17px}
.checklist .on span{text-decoration:line-through;color:var(--muted)}

/* lesson */
.goals{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:12px;padding:14px 18px}
.goals ul{margin:0}
.prose{font-size:1.05rem}
.prose b{font-weight:700}
.code{border-radius:var(--r);overflow:hidden;background:var(--code-bg);min-width:0}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid var(--code-line);direction:ltr}
.code-head span{font-family:var(--f-mono);font-size:.72rem;color:var(--code-muted);text-transform:uppercase;letter-spacing:.06em}
.code-head button{background:none;border:1px solid var(--code-line);color:var(--code-ink);border-radius:6px;font-size:.75rem;padding:2px 10px}
.code pre{margin:0;border-radius:0}
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px}
.points{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.points li{padding-inline-start:22px;position:relative}
.points li::before{content:"→";position:absolute;inset-inline-start:0;color:var(--accent);font-weight:700}
.task{border:2px solid var(--accent);border-radius:14px;padding:20px 22px;background:var(--surface)}
.task h2{font-size:1.15rem;margin-bottom:8px;display:flex;gap:8px;align-items:center}
textarea{width:100%;min-height:110px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical}
textarea.mono{font-family:var(--f-mono);font-size:.85rem;direction:ltr;text-align:left}
.answer{display:none;background:var(--sunk);border-radius:12px;padding:16px 18px;font-size:.98rem}
.answer.show{display:block}
.answer pre{font-size:.8rem}
.teacher-only{display:none} body.has-sample .teacher-only{display:block} body.has-sample .no-teacher{display:none}
.no-teacher{font-size:.9rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:.85rem}
.history{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.history details{background:var(--sunk);border-radius:10px;padding:8px 14px}
.history summary{cursor:pointer;font-weight:600;font-size:.92rem}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.pager a{max-width:48%;text-decoration:none;color:var(--ink);display:flex;flex-direction:column}
.pager a small{color:var(--muted)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.q h3{font-family:var(--f-body);font-weight:700;font-size:1.02rem}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--accent)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:.92rem;color:var(--muted);display:none} .graded .why{display:block}
.score{font-family:var(--f-display);font-size:1.3rem}
.iv details{border-bottom:1px solid var(--line);padding:12px 0}
.iv summary{cursor:pointer;font-weight:700}
.iv .a{margin-top:8px;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px 14px}

/* highlight.js tokens (themed for both modes via tokens) */
.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section,.hljs-doctag{color:var(--hl-key)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute{color:var(--hl-str)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--hl-num)}
.hljs-title,.hljs-title.function_,.hljs-built_in,.hljs-name{color:var(--hl-fn)}
.hljs-comment,.hljs-quote,.hljs-meta{color:var(--hl-com);font-style:italic}
.hljs-type,.hljs-title.class_,.hljs-attr,.hljs-variable,.hljs-template-variable,.hljs-params{color:var(--hl-type)}

/* ---- color layer ---- */
.top::after{content:"";position:absolute;inset:auto 0 -1px 0;height:3px;background:linear-gradient(90deg,var(--g0),var(--g1),var(--g2),var(--g3),var(--g4))}
.brand-mark{background:linear-gradient(120deg,var(--g0),var(--g1));color:#fff}
.rail .group{color:var(--c)}
.rail a .num{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border-radius:6px;text-align:center;padding:2px 0;font-weight:600}
.rail a.on{background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.rail a:hover{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.bar i{background:var(--c)}
.map-group .label{color:var(--c)}
.map-row .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-c);font-weight:600}
.map-row:hover h3{color:var(--c)}
.chip.idx{background:var(--c);color:var(--on-c)}
.hero{border-radius:22px;padding:26px;background:
  radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--g0) 26%,transparent),transparent 42%),
  radial-gradient(circle at 8% 90%,color-mix(in srgb,var(--g3) 24%,transparent),transparent 45%),
  radial-gradient(circle at 55% 110%,color-mix(in srgb,var(--g1) 22%,transparent),transparent 40%),
  var(--surface);border:1px solid var(--line)}
.hero .label{color:var(--g4)}
.req{box-shadow:0 14px 34px color-mix(in srgb,var(--g3) 22%,transparent)}
.stat:nth-child(1){--c:var(--g0)} .stat:nth-child(2){--c:var(--g2)} .stat:nth-child(3){--c:var(--g3)}
.stat{border-top:4px solid var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.stat b{color:var(--c)}
.next{background:linear-gradient(115deg,color-mix(in srgb,var(--g1) 24%,var(--surface)),color-mix(in srgb,var(--g0) 20%,var(--surface)) 60%,color-mix(in srgb,var(--g4) 18%,var(--surface)))}
.next .label{color:var(--g0)}
.method div:nth-child(1){--c:var(--g0)} .method div:nth-child(2){--c:var(--g1)} .method div:nth-child(3){--c:var(--g2)} .method div:nth-child(4){--c:var(--g3)} .method div:nth-child(5){--c:var(--g4)}
.method div{border-top-color:var(--c);background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:0 0 10px 10px;padding:10px 12px}
.method b{color:var(--c)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--g4) 35%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--g4) 65%,var(--sunk))}
.heat i[data-l="3"]{background:var(--g4)}
.mod-head{border-radius:20px;padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--surface)),color-mix(in srgb,var(--c) 5%,var(--surface)))}
.tabs a.on{border-bottom-color:var(--c);color:var(--c)}
.tick.on{background:var(--c);border-color:var(--c);color:var(--on-c)}
.lesson-item:hover b{color:var(--c)}
.goals{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.goals .label{color:var(--c)}
.points li::before{color:var(--c)}
.task{border-color:var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.task .chip.ok{background:var(--c);color:var(--on-c)}
.prose b{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.code-head span{color:var(--hl-key)}
.crumbs a{color:var(--c)}
.iv summary::marker{color:var(--c)}
.history .label{color:var(--c)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-flex}
  .rail{position:fixed;top:calc(57px + env(safe-area-inset-top,0px));bottom:0;right:0;width:min(320px,88vw);height:auto;z-index:8;transform:translateX(105%);transition:transform .2s ease;box-shadow:0 10px 40px rgba(0,0,0,.25);padding-right:max(12px,env(safe-area-inset-right,0px))}
  body.menu-open .rail{transform:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .compare{grid-template-columns:minmax(0,1fr)}
  .method{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sync span{display:none}
}
@media (max-width:520px){
  h1{font-size:1.6rem}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:10px}
  .stat b{font-size:1.25rem}
  .map-row{grid-template-columns:34px minmax(0,1fr);}
  .map-row .meta{grid-column:2;align-items:flex-start;flex-direction:row;gap:10px}
  .map-row .meta .bar{width:90px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <button class="menu-btn" data-act="menu" aria-label="פתיחת רשימת המודולים">מודולים</button>
  <a class="brand" href="#home"><span class="brand-mark">200 OK</span><b>Backend מאפס ל-Scale</b></a>
  <div class="grow"></div>
  <div class="sync" id="sync" data-s="local"><i></i><span id="sync-text">נשמר בדפדפן</span></div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="מודולים"></nav>
  <main id="main"></main>
</div>

<script src="course.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/nginx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
<script>
(() => {
const C = window.COURSE || [];
const ALL = [];
C.forEach((m, mi) => m.lessons.forEach((l, li) => ALL.push({ m, l, mi, li })));
const GROUPS = [
  { name: "יסודות", ids: ["m0", "m1", "m2"] },

  { name: "Scale", ids: ["m8", "m9", "m10", "m11"] },
  { name: "קריירה", ids: ["m12"] },
];

const cv = id => "--c:var(--g" + gOf(id) + ")";
const modById = id => C.find(m => m.id === id);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const strip = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.replace(/\s+/g, " ").trim(); };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const pad2 = n => String(n).padStart(2, "0");

/* ---------- state & persistence ---------- */
const LS_KEY = "backend-course-progress-v1";
const blank = () => ({ v: 1, lessons: {}, project: {}, quiz: {}, notes: {}, solutions: {}, qa: {}, days: {}, last: null });
function normalize(s) { const b = blank(); for (const k in b) if (s && s[k] !== undefined) b[k] = s[k]; return b; }
let state = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch {}
let ref = null, lastWritten = "", writing = false, dirty = false, writeTimer = null;

function setSync(s) {
  const el = document.getElementById("sync"); el.dataset.s = s;
  document.getElementById("sync-text").textContent =
    { saved: "ההתקדמות נשמרה", saving: "שומר…", error: "השמירה נכשלה, ננסה שוב", local: "נשמר בדפדפן בלבד", loading: "טוען התקדמות…" }[s] || "";
}
function save(activity = true) {
  if (activity) { const t = today(); state.days[t] = (state.days[t] || 0) + 1; }
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
  if (ref) { dirty = true; setSync("saving"); clearTimeout(writeTimer); writeTimer = setTimeout(flush, 700); }
}
async function flush() {
  if (!ref || writing || !dirty) return;
  writing = true; dirty = false;
  const body = JSON.parse(JSON.stringify(state));
  lastWritten = JSON.stringify(body);
  try { await ref.set(body); setSync("saved"); }
  catch (e) { setSync("error"); dirty = true; setTimeout(flush, 4000); }
  writing = false;
  if (dirty) flush();
}
async function connectDb() {
  if (!window.claude?.use) { setSync("local"); return; }
  setSync("loading");
  let db = null;
  try { db = await window.claude.use("db"); } catch {}
  if (!db) { setSync("local"); return; }
  ref = db.doc("progress/main");
  const timer = setTimeout(() => setSync("local"), 10000);
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (!snap.exists) {
      if (!snap.metadata.fromCache) { if (Object.keys(state.lessons).length || Object.keys(state.days).length) { dirty = true; flush(); } else setSync("saved"); }
      return;
    }
    const s = JSON.stringify(snap.data());
    if (s === lastWritten) { setSync("saved"); return; }
    lastWritten = s;
    state = normalize(JSON.parse(s));
    try { localStorage.setItem(LS_KEY, s); } catch {}
    const a = document.activeElement;
    if (!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT"))) render();
    setSync("saved");
  }, () => { clearTimeout(timer); setSync("error"); });
}
let sample = null;
async function connectSample() {
  if (!window.claude?.use) return;
  try { sample = await window.claude.use("sample"); } catch {}
  if (sample) document.body.classList.add("has-sample");
}

/* ---------- derived progress ---------- */
const isDone = id => !!state.lessons[id]?.done;
function modStats(m) {
  const done = m.lessons.filter(l => isDone(l.id)).length;
  const steps = state.project[m.id] || [];
  const stepsDone = m.project.steps.filter((_, i) => steps[i]).length;
  const q = state.quiz[m.id];
  const total = m.lessons.length + m.project.steps.length + 1;
  const got = done + stepsDone + (q && q.score / q.total >= 0.75 ? 1 : 0);
  return { done, n: m.lessons.length, stepsDone, steps: m.project.steps.length, q, pct: got / total };
}
function chip(m) {
  const s = modStats(m);
  if (s.pct >= 1) return '<span class="chip ok">200 OK</span>';
  if (s.pct > 0) return '<span class="chip part">206 ' + Math.round(s.pct * 100) + '%</span>';
  return '<span class="chip">—</span>';
}
function nextLesson() { return ALL.find(x => !isDone(x.l.id)); }

/* ---------- rendering helpers ---------- */
function codeBlock(src, lang, label) {
  const L = lang === "typescript" ? "typescript" : lang;
  return '<div class="code"><div class="code-head"><span>' + esc(label || lang) + '</span><button data-act="copy">העתקה</button></div><pre><code data-lang="' + esc(L) + '">' + esc(src) + '</code></pre></div>';
}
function md(text) {
  const parts = String(text).split(/```(\w*)\n?([\s\S]*?)(?:```|$)/g);
  let out = "";
  for (let i = 0; i < parts.length; i += 3) {
    out += inlineMd(parts[i]);
    if (i + 2 < parts.length) out += '<pre><code data-lang="' + esc(parts[i + 1] || "plaintext") + '">' + esc(parts[i + 2].replace(/\n$/, "")) + '</code></pre>';
  }
  return out;
}
function inlineMd(t) {
  const lines = esc(t).split("\n");
  let html = "", inList = false, para = [];
  const fmt = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const flushP = () => { if (para.length) { html += "<p>" + fmt(para.join(" ")) + "</p>"; para = []; } };
  for (const raw of lines) {
    const line = raw.trim();
    const li = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    const h = line.match(/^#{1,4}\s+(.*)/);
    if (li) { flushP(); if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + fmt(li[1]) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (h) { flushP(); html += "<p><b>" + fmt(h[1]) + "</b></p>"; continue; }
    if (!line) { flushP(); continue; }
    para.push(line);
  }
  flushP(); if (inList) html += "</ul>";
  return html;
}
function highlight(root) {
  if (!window.hljs) return;
  root.querySelectorAll("code[data-lang]").forEach(el => {
    const lang = el.dataset.lang;
    if (lang && lang !== "plaintext" && hljs.getLanguage(lang)) {
      try { el.innerHTML = hljs.highlight(el.textContent, { language: lang, ignoreIllegals: true }).value; } catch {}
    }
  });
}

const quizDraft = {};
function quizView(m) {
  const saved = state.quiz[m.id];
  const draft = quizDraft[m.id] || { answers: {}, graded: false };
  quizDraft[m.id] = draft;
  let h = saved && !draft.graded ? '<div class="panel row" style="justify-content:space-between"><span>ניסיון אחרון: <b>' + saved.score + '/' + saved.total + '</b></span><span class="muted" style="font-size:.9rem">ציון 75% ומעלה מסמן את הבוחן כעבר</span></div>' : "";
  h += '<div class="' + (draft.graded ? "graded" : "") + '">' + m.quiz.map((q, qi) => {
    const pick = draft.answers[qi];
    return '<div class="q"><h3>' + (qi + 1) + '. ' + esc(q.q) + '</h3>' + q.opts.map((o, oi) => {
      let cls = "opt";
      if (draft.graded) { if (oi === q.a) cls += " right"; else if (pick === oi) cls += " wrong"; }
      return '<label class="' + cls + '"><input type="radio" id="q-' + m.id + '-' + qi + '-' + oi + '" name="q-' + m.id + '-' + qi + '" data-act="pick" data-m="' + m.id + '" data-q="' + qi + '" data-o="' + oi + '"' + (pick === oi ? " checked" : "") + (draft.graded ? " disabled" : "") + '><span>' + esc(o) + '</span></label>';
    }).join("") + '<div class="why">' + esc(q.why) + '</div></div>';
  }).join("") + '</div>';
  if (draft.graded) {
    const sc = m.quiz.filter((q, i) => draft.answers[i] === q.a).length;
    h += '<div class="row" style="justify-content:space-between"><span class="score">' + sc + '/' + m.quiz.length + (sc / m.quiz.length >= .75 ? " · עברת!" : " · שווה לחזור על החומר") + '</span><button class="btn" data-act="retry" data-m="' + m.id + '">לנסות שוב</button></div>';
  } else {
    h += '<div class="row"><button class="btn primary" data-act="grade" data-m="' + m.id + '">בדיקה</button><span class="muted" id="quiz-msg"></span></div>';
  }
  return h;
}

    '<label class="label" for="sol-' + l.id + '" style="display:block;margin:12px 0 6px">הפתרון שלך (קוד או הסבר)</label><textarea class="mono" id="sol-' + l.id + '" data-act="sol" data-id="' + l.id + '" placeholder="// הדביקי כאן את הקוד או התשובה">' + esc(state.solutions[l.id] || "") + '</textarea>' +
    '<div class="teacher-only" style="margin-top:10px"><button class="btn" data-act="review" data-id="' + l.id + '">שליחה לבדיקה אצל המורה</button><div class="answer" id="ans-rev-' + l.id + '" style="margin-top:12px"></div></div></section>' +
    askBox(l.id, "שאלי את המורה", ["תסביר שוב בפשטות", "תן דוגמה נוספת מ-TaskFlow", "תבחן אותי על השיעור"]) +
    '<section><label class="label" for="note-' + l.id + '" style="display:block;margin-bottom:6px">הערות אישיות</label><textarea id="note-' + l.id + '" data-act="note" data-id="' + l.id + '" placeholder="מה למדת, מה עוד לא ברור, קישורים">' + esc(state.notes[l.id] || "") + '</textarea></section>' +
    '<div class="row"><button class="btn ' + (done ? "done" : "primary") + '" data-act="done" data-id="' + l.id + '">' + (done ? "✓ השיעור הושלם" : "סימון השיעור כהושלם") + '</button></div>' +
    '<nav class="pager">' + (prev ? '<a href="#' + prev.l.id + '"><small>→ הקודם</small>' + esc(prev.l.title) + '</a>' : "<span></span>") +
    (next ? '<a href="#' + next.l.id + '" style="text-align:left"><small>הבא ←</small>' + esc(next.l.title) + '</a>' : '<a href="#m12-project" style="text-align:left"><small>הבא ←</small>פרויקט הגמר</a>') + '</nav></div>';
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || "#home").slice(1);
  const main = document.getElementById("main");
  let active = "home", html;
  const lm = lessonById(h);
  const mm = h.match(/^(m\d+)(?:-(project|quiz|interview))?$/);
  if (lm) { active = lm.m.id; html = viewLesson(lm); }
  else if (mm && modById(mm[1])) { active = mm[1]; html = viewModule(modById(mm[1]), mm[2] || ""); }
  else html = viewHome();
  renderRail(active);
  main.innerHTML = html;
  highlight(main);
  return active;
}
let lastHash = null;
function render() {
  const changed = location.hash !== lastHash;
  route();
  if (changed) { window.scrollTo(0, 0); lastHash = location.hash; }
}
window.addEventListener("hashchange", () => { document.body.classList.remove("menu-open"); const l = lessonById(location.hash.slice(1)); if (l) { state.last = l.l.id; save(false); } render(); });

/* ---------- teacher ---------- */
const SYSTEM = 'אתה מורה אישי ל-Backend בקורס "Backend מאפס ל-Scale". התלמידה יודעת Python, מכירה Git ו-SQL ומכירה Linux מעט. היא לומדת Node.js + TypeScript, ומטרתה משרת Junior Backend. הפרויקט המתגלגל בקורס: TaskFlow, REST API לניהול משימות בצוותים (Express, Postgres/Prisma, Redis, BullMQ ובהמשך Kafka). ענה בעברית ופנה אליה בלשון נקבה. כתוב קצר וברור, עד כ-250 מילים, אלא אם צריך קוד. קוד ב-TypeScript בתוך ```ts. כשמועיל, השווה ל-Python. כשבודקים פתרון: קודם מה טוב, אחר כך מה שגוי או חסר, ותן רמז לפני פתרון מלא. בבחינה או בראיון: שאל שאלה אחת בכל פעם וחכה לתשובה.';
function contextFor(key) {
  const l = lessonById(key);
  if (l) return "מודול " + l.mi + ": " + l.m.title + "\nשיעור: " + l.l.title + "\nמטרות: " + l.l.goals.join("; ") + "\nתוכן השיעור (תקציר): " + strip(l.l.body).slice(0, 1400) + "\nהתרגיל: " + strip(l.l.task);
  const m = modById(key.replace(/^(proj|iv)-/, ""));
  if (m && key.startsWith("proj-")) return "מודול " + C.indexOf(m) + ": " + m.title + "\nשלב בפרויקט: " + m.project.title + "\nמשימות: " + m.project.steps.join("; ");
  if (m) return "מודול " + C.indexOf(m) + ": " + m.title + "\nנושאים: " + m.lessons.map(x => x.title).join(", ") + "\nשאלות ראיון לדוגמה: " + m.interview.map(x => x.q).join(" | ");
  return "";
}
async function askTeacher(key, question, outId, kind) {
  const out = document.getElementById(outId);
  if (!sample || !out) return;
  const thread = (state.qa[key] || []).slice(-2);
  const msgs = [];
  const head = SYSTEM + "\n\n--- הקשר ---\n" + contextFor(key) + "\n\n";
  if (thread.length) {
    msgs.push({ role: "user", content: head + thread[0].q });
    msgs.push({ role: "assistant", content: thread[0].a });
    for (const t of thread.slice(1)) { msgs.push({ role: "user", content: t.q }); msgs.push({ role: "assistant", content: t.a }); }
    msgs.push({ role: "user", content: question });
  } else msgs.push({ role: "user", content: head + question });
  out.classList.add("show"); out.innerHTML = '<span class="muted">המורה חושב…</span>';
  try {
    const r = await sample(msgs, { cache: false, onText: ({ text }) => { out.innerHTML = md(text); } });
    out.innerHTML = md(r.text); highlight(out);
    const arr = state.qa[key] || (state.qa[key] = []);
    arr.push({ q: kind === "review" ? "[בדיקת פתרון] " + question.slice(0, 400) : question, a: r.text, at: new Date().toISOString() });
    if (arr.length > 12) arr.splice(0, arr.length - 12);
    save();
  } catch (e) {
    out.innerHTML = '<span class="muted">' + (e && e.code === "rate_limited" ? "יותר מדי שאלות ברצף. כדאי לחכות דקה ולנסות שוב." : e && e.code === "not_granted" ? "לא אושרה גישה למורה בדף הזה. אפשר לשאול אותי בצ'אט של Claude Code." : "לא התקבלה תשובה. כדאי לנסות שוב בעוד רגע.") + '</span>';
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "menu") { document.body.classList.toggle("menu-open"); return; }
  if (a === "copy") {
    const code = t.closest(".code").querySelector("code").textContent;
    const ok = () => { t.textContent = "הועתק"; setTimeout(() => t.textContent = "העתקה", 1500); };
    try { navigator.clipboard.writeText(code).then(ok, () => { selectText(t); }); } catch { selectText(t); }
    return;
  }
  if (a === "done") { const id = t.dataset.id; if (isDone(id)) delete state.lessons[id]; else state.lessons[id] = { done: true, at: new Date().toISOString() }; save(); render(); return; }
  if (a === "grade") {
    const m = modById(t.dataset.m), d = quizDraft[m.id];
    if (Object.keys(d.answers).length < m.quiz.length) { document.getElementById("quiz-msg").textContent = "נשארו שאלות בלי תשובה"; return; }
    d.graded = true;
    const sc = m.quiz.filter((q, i) => d.answers[i] === q.a).length;
    const prev = state.quiz[m.id];
    state.quiz[m.id] = { score: Math.max(sc, prev?.score || 0), total: m.quiz.length, last: sc, at: new Date().toISOString(), answers: d.answers };
    save(); render(); return;
  }
  if (a === "retry") { quizDraft[t.dataset.m] = { answers: {}, graded: false }; render(); return; }
  if (a === "quick") { const ta = document.getElementById("ask-" + t.dataset.k); ta.value = t.dataset.q; askTeacher(t.dataset.k, t.dataset.q, "ans-" + t.dataset.k); return; }
  if (a === "ask") { const ta = document.getElementById("ask-" + t.dataset.k); const q = ta.value.trim(); if (!q) { ta.focus(); return; } askTeacher(t.dataset.k, q, "ans-" + t.dataset.k); return; }
  if (a === "review") {
    const id = t.dataset.id, sol = (state.solutions[id] || "").trim();
    const out = document.getElementById("ans-rev-" + id);
    if (!sol) { out.classList.add("show"); out.innerHTML = '<span class="muted">קודם צריך לכתוב פתרון בתיבה למעלה.</span>'; return; }
    askTeacher(id, "זה הפתרון שלי לתרגיל. תבדוק אותו בבקשה:\n\n" + sol, "ans-rev-" + id, "review"); return;
  }
});
function selectText(btn) { const r = document.createRange(); r.selectNodeContents(btn.closest(".code").querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "סומן, Ctrl+C"; }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.act === "step") { const arr = state.project[t.dataset.m] || (state.project[t.dataset.m] = []); arr[+t.dataset.i] = t.checked; t.closest("label").classList.toggle("on", t.checked); save(); renderRail(t.dataset.m); }
  if (t.dataset.act === "pick") { quizDraft[t.dataset.m].answers[+t.dataset.q] = +t.dataset.o; }
});
let typeTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.act === "note" || t.dataset.act === "sol") {
    (t.dataset.act === "note" ? state.notes : state.solutions)[t.dataset.id] = t.value;
    clearTimeout(typeTimer); typeTimer = setTimeout(() => save(), 900);
  }
});

/* ---------- boot ---------- */
if (!location.hash && state.last) { /* stay on home; next-step card points to the lesson */ }
render();
connectDb();
connectSample();
})();
</script>
